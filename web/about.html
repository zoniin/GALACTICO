<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--shell:head-->
<style>
@layer page {
  .about-contents ul { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0 0 var(--space-7); padding: 0; list-style: none; }
  .about-contents a { display: inline-flex; align-items: center; min-height: var(--target-touch); padding: 0 var(--space-4); border: 1px solid var(--border-control); border-radius: var(--radius-pill); background: var(--surface-1); color: var(--text); font-size: var(--text-sm); font-weight: var(--weight-semibold); text-decoration: none; }
  .about-contents a:hover { background: var(--surface-2); }
  .about-section { max-width: 72rem; scroll-margin-top: var(--space-4); }
  .about-section > p { max-width: 72ch; }
  .about-list { display: grid; gap: var(--space-3); max-width: 80ch; margin: 0 0 var(--space-5); padding: 0; list-style: none; }
  .about-list > li { padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
  .about-step { color: var(--text-muted); font-size: var(--text-sm); }
  .about-section h3 { margin: var(--space-5) 0 var(--space-2); }
}
</style>
</head>
<body>
<!--shell:header-->
<main id="main" class="page-main">
<header class="page-header">
<h1>About the numbers</h1>
<p class="page-answer"><!--slot:answer--></p>
</header>
<!--slot:contents-->
<!--slot:sections-->
</main>
<!--shell:footer-->
</body>
</html>
