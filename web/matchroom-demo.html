<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scouting demo · Galáctico</title>
<style>:root{color-scheme:light dark}body{max-width:880px;margin:3vh auto;padding:8px}a{color:inherit}</style></head><body>
<div id="madrid-matchroom">
  <header class="mr-mast"><a class="mr-wordmark" href="/match-centre">Galáctico</a><span class="mr-demo">Demo · all figures invented</span></header>
  <nav aria-label="Galáctico workspaces">
    <button type="button" data-page="match" aria-pressed="true">Match centre</button>
    <button type="button" data-page="players" aria-pressed="false">Player comparison</button>
    <button type="button" data-page="scout" aria-pressed="false">Transfer shortlist</button>
  </nav>
  <main id="mr-body" aria-live="polite"></main>
</div>
<style>
#madrid-matchroom{--paper:light-dark(#f8f7f4,#171921);--ink:light-dark(#17192c,#f1f1f5);--soft:light-dark(#575668,#c2bfcb);--line:light-dark(#d6d3da,#3d3d4b);--club:light-dark(#49378b,#c3b0ff);--tint:light-dark(#e8e3f5,#393148);--focus:light-dark(#5943a5,#cab6ff);background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;box-sizing:border-box;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:15px}
#madrid-matchroom *{box-sizing:border-box}
#madrid-matchroom .mr-mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px 8px}
#madrid-matchroom .mr-wordmark{font:italic 600 26px Georgia,serif;letter-spacing:-1px}
#madrid-matchroom .mr-demo{color:var(--soft);font-size:12px}
#madrid-matchroom nav{padding:0 20px;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#madrid-matchroom button,#madrid-matchroom select{font:inherit;color:inherit}
#madrid-matchroom button{cursor:pointer}
#madrid-matchroom button:focus-visible,#madrid-matchroom select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#madrid-matchroom nav button{border:0;padding:12px 0;background:transparent;color:var(--soft);border-bottom:3px solid transparent}
#madrid-matchroom nav button[aria-pressed=true]{border-color:var(--club);color:var(--club);font-weight:600}
#madrid-matchroom main{padding:20px 22px 22px;display:grid;gap:14px}
#madrid-matchroom h2,#madrid-matchroom h3,#madrid-matchroom p{margin:0}
#madrid-matchroom h2{font:500 clamp(23px,4.5vw,33px)/1.14 Georgia,serif;letter-spacing:-.025em}
#madrid-matchroom h3{font-size:16px;font-weight:600}
#madrid-matchroom .mr-row,#madrid-matchroom .mr-filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#madrid-matchroom .mr-between{justify-content:space-between}
#madrid-matchroom label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--soft);font-size:13px}
#madrid-matchroom select,#madrid-matchroom .mr-action{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink)}
#madrid-matchroom .mr-action{background:var(--tint);border-color:transparent;color:var(--club);font-weight:600}
#madrid-matchroom .mr-inner{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
#madrid-matchroom .mr-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 0;text-align:center}
#madrid-matchroom .mr-team{font-size:clamp(16px,3vw,21px);font-weight:600}
#madrid-matchroom .mr-goals{font:500 clamp(27px,6vw,45px)/1 Georgia,serif;white-space:nowrap}
#madrid-matchroom .mr-small,#madrid-matchroom .mr-note{color:var(--soft);font-size:13px;line-height:1.45}
#madrid-matchroom table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#madrid-matchroom th,#madrid-matchroom td{padding:9px 5px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
#madrid-matchroom th{font-size:12px;color:var(--soft);font-weight:500}
#madrid-matchroom td:first-child,#madrid-matchroom th:first-child{text-align:left;padding-left:0}
#madrid-matchroom .mr-feature{color:var(--club);font-weight:600}
#madrid-matchroom .mr-need{padding:12px 14px;border-left:3px solid var(--club);background:var(--tint);line-height:1.45}
@media(max-width:510px){#madrid-matchroom .mr-mast{padding:12px 12px 5px}#madrid-matchroom nav{padding:0 12px;gap:8px}#madrid-matchroom nav button{font-size:13px;min-height:44px}#madrid-matchroom main{padding:14px 12px}#madrid-matchroom td,#madrid-matchroom th{font-size:12px}#madrid-matchroom select,#madrid-matchroom .mr-action{min-height:44px}#madrid-matchroom .mr-score{gap:4px}}
@media(max-width:390px){#madrid-matchroom main[data-view=scout] th:nth-child(4),#madrid-matchroom main[data-view=scout] td:nth-child(4){display:none}}
</style>
<script>
(() => {
 const root=document.getElementById('madrid-matchroom'), body=root.querySelector('main');
 const splitLabels={all:'All opponents',top:'Top six',rest:'Outside top six'};
 const metricLabels={keys:'Key passes',wins:'Interceptions'};
 // Minutes, key passes, interceptions. All are invented sample counts.
 const pool={
  'Adam Wharton':{top:[360,6,7],rest:[720,19,14]},
  'Angelo Stiller':{top:[405,8,5],rest:[675,17,10]},
  'Carlos Baleba':{top:[315,3,9],rest:[810,11,23]},
  'Madrid midfield role':{top:[450,5,8],rest:[900,20,16]}
 };
 const spells=[
  {minute:45,score:'0 – 0',event:'Half-time · Madrid level',players:[[42,1,2],[34,0,1],[20,1,0]]},
  {minute:64,score:'1 – 0',event:'58′ · Real Madrid goal',players:[[58,2,3],[48,0,2],[26,2,0]]},
  {minute:83,score:'1 – 1',event:'78′ · Villarreal equalise',players:[[74,2,3],[62,1,3],[32,3,1]]}
 ];
 const state={page:'match',moment:1,split:'top',need:'keys',candidate:'Adam Wharton'};
 const players=['Federico Valverde','Eduardo Camavinga','Jude Bellingham'];
 const options=(entries,selected)=>Object.entries(entries).map(([k,v])=>'<option value="'+k+'"'+(k===String(selected)?' selected':'')+'>'+v+'</option>').join('');
 const select=(label,key,opts)=>'<label>'+label+' <select aria-label="'+label+'" data-control="'+key+'">'+options(opts,state[key])+'</select></label>';
 const button=(label,go)=>'<button type="button" class="mr-action" data-go="'+go+'">'+label+' →</button>';
 const table=(heads,rows)=>'<table><thead><tr>'+heads.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(cells=>'<tr>'+cells.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 function stats(name){
   const group=pool[name], r=state.split==='all'?group.top.map((x,i)=>x+group.rest[i]):group[state.split];
   return {minutes:r[0],keys:90*r[1]/r[0],wins:90*r[2]/r[0]};
 }
 function match(){
   const s=spells[state.moment];
   return '<div class="mr-row mr-between"><h2>Match centre</h2>'+select('Replay','moment',{'0':'45′ · Half-time','1':'64′ · Second half','2':'83′ · Second half'})+'</div>'+
    '<section aria-label="Example match"><div class="mr-score"><span class="mr-team">Real Madrid</span><span class="mr-goals">'+s.score+'</span><span class="mr-team">Villarreal</span></div><p class="mr-small">'+s.event+'</p></section>'+
    '<div class="mr-inner"><h3>Madrid midfield at '+s.minute+'′</h3>'+
    table(['Player','Completed passes','Key passes','Interceptions'],players.map((v,i)=>[v,...s.players[i]]))+
    '</div><div>'+button('Compare the midfield over the season','players')+'</div>';
 }
 function comparison(){
   const a=stats(state.candidate),b=stats('Madrid midfield role');
   return '<h2>Compare midfielders</h2><div class="mr-filters">'+select('Scout','candidate',Object.fromEntries(Object.keys(pool).slice(0,3).map(x=>[x,x])))+
    select('League opponents','split',splitLabels)+'</div>'+
    table(['Season sample',state.candidate,'Madrid midfield role'],[['Minutes',a.minutes,b.minutes],['Key passes / 90',a.keys.toFixed(2),b.keys.toFixed(2)],['Interceptions / 90',a.wins.toFixed(2),b.wins.toFixed(2)]])+
    '<p class="mr-note">Top six uses league position before kick-off in each player’s own league. The Madrid reference pools minutes in the target role.</p><div>'+button('Scout for this role','scout')+'</div>';
 }
 function scouting(){
   const m=state.need, base=stats('Madrid midfield role')[m], other=m==='keys'?'wins':'keys';
   const ranking=Object.keys(pool).slice(0,3).map(n=>[n,stats(n)]).sort((a,b)=>b[1][m]-a[1][m]);
   return '<h2>Transfer shortlist</h2><div class="mr-filters">'+select('Midfield need','need',{keys:'Create shots for teammates',wins:'Intercept passes'})+select('League opponents','split',splitLabels)+'</div>'+
    '<p class="mr-need">Madrid role reference · <strong>'+base.toFixed(2)+'</strong> '+metricLabels[m].toLowerCase()+' per 90</p>'+
    table(['Candidate',metricLabels[m]+' / 90','Gap to Madrid',metricLabels[other]+' / 90','Minutes'],ranking.map(([n,v])=>[n,v[m].toFixed(2),'<span class="mr-feature">'+(v[m]>=base?'+':'')+(v[m]-base).toFixed(2)+'</span>',v[other].toFixed(2),v.minutes]))+
    '<p class="mr-note">Ordered by the selected need. Rates are observed in the player’s own league. Fee, availability and post-transfer performance are unknown.</p>';
 }
 function draw(){
   body.dataset.view=state.page;
   root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(state.page===b.dataset.page)));
   body.innerHTML=({match,players:comparison,scout:scouting})[state.page]();
 }
 root.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-page]');if(!b)return;state.page=b.dataset.go||b.dataset.page;draw();if(b.dataset.go)root.querySelector('[data-page="'+state.page+'"]').focus();});
 root.addEventListener('change',e=>{const k=e.target.dataset.control;if(!k)return;state[k]=k==='moment'?Number(e.target.value):e.target.value;draw();body.querySelector('[data-control="'+k+'"]').focus();});
 draw();
})();
</script>
</body></html>
