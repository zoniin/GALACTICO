<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--shell:head-->
  <link rel="stylesheet" href="/static/match-centre.css"><link rel="stylesheet" href="/static/studio-shell.css">
  <script src="/static/match-centre.js" defer></script>
</head>
<body>
  <!--shell:header-->
  <main id="main" class="frame">
    <div class="heading"><h1>Matches</h1>
      <label class="source" hidden>Data source <select id="source"><option value="openfootball">OpenFootball</option></select></label>
    </div>
    <p id="coverage">Loading coverage…</p>
    <div class="layout">
      <section class="board" aria-label="Scoreboard">
        <div class="daybar">
          <button id="back" aria-label="Previous day">←</button>
          <label><span class="sr">Fixture date</span><input type="date" id="day"></label>
          <button id="forward" aria-label="Next day">→</button><button id="today">Today</button>
        </div>
        <div class="filters" aria-label="Fixture filters">
          <button data-filter="all" aria-pressed="true">All matches</button><button data-filter="madrid" aria-pressed="false">Real Madrid</button>
          <button data-filter="saved" aria-pressed="false">Saved</button><button data-filter="live" aria-pressed="false" hidden>Live</button>
        </div>
        <label class="search"><span class="sr">Search teams and competitions</span><input type="search" id="search" placeholder="Search teams or competitions"></label>
        <div id="meta" class="note" role="status"></div>
        <div id="fixtures"></div>
        <div id="nearby" class="actions"></div>
      </section>
      <aside aria-label="Match report">
        <div id="spotlight"></div>
        <section class="report" id="report" aria-label="Selected match" tabindex="-1">
          <h2>Match report</h2><p>Choose a fixture to open its report.</p>
        </section>
      </aside>
    </div>
    <footer><a href="https://github.com/openfootball/football.json">OpenFootball coverage</a> · <a href="https://www.api-football.com/documentation-v3">API-Football coverage</a></footer>
  </main>
  <!--shell:footer-->
</body></html>
