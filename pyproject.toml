[project]
name = "galactico"
version = "0.1.0"
description = "An open computational framework for asking football decisions as explicit, testable questions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "ortools>=9.11",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9", "mplsoccer>=1.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galactico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "research: research acceptance test; may fail without failing the build",
    "slow: requires a downloaded corpus",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
