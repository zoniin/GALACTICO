name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv venv && uv pip install -e ".[dev,api]"

      # Licensing runs first. A licence mistake is the only failure here that a
      # later commit cannot fix.
      - name: licence guard
        run: uv run python scripts/check_licensing.py

      - name: lint
        run: uv run ruff check galactico tests

      - name: tests
        run: uv run pytest -q -m "not research"

      # Research acceptance tests ask whether a model beats its baseline. When
      # they fail the model is wrong, not the code, so they report separately.
      - name: research acceptance
        continue-on-error: true
        run: uv run pytest -q -m research

  historical-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv python install 3.12
      - run: uv venv && uv pip install -e ".[dev,api]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Public CC BY 4.0 only. Runtime corpus is never uploaded as an artifact.
      - run: uv run python scripts/fetch_pappalardo.py --only Spain
      - run: uv run python scripts/prepare_lab.py
      - run: npx playwright test e2e/smoke.spec.js e2e/labs.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
