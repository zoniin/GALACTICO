name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv venv && uv pip install -e ".[dev]"

      # Licensing runs first. A licence mistake is the only failure here that a
      # later commit cannot fix.
      - name: licence guard
        run: uv run python scripts/check_licensing.py

      - name: lint
        run: uv run ruff check galactico tests

      - name: tests
        run: uv run pytest -q -m "not research"

      # Research acceptance tests ask whether a model beats its baseline. When
      # they fail the model is wrong, not the code, so they report separately.
      - name: research acceptance
        continue-on-error: true
        run: uv run pytest -q -m research
